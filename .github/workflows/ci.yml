name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-ponto-digital-servioeste-front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: system-ponto-digital-servioeste-front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: system-ponto-digital-servioeste-front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tipos do front em dia com o contrato do back
        run: |
          pnpm contracts
          git diff --exit-code src/contracts/schema.d.ts
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Nenhum dado simulado no build de produção
        working-directory: .
        run: ./scripts/check-no-mocks.sh

  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-ponto-digital-servioeste-back
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ponto_owner
          POSTGRES_PASSWORD: ponto_owner_ci
          POSTGRES_DB: ponto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ponto_owner -d ponto" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ponto_app:ponto_app_ci@localhost:5432/ponto
      DATABASE_OWNER_URL: postgresql+asyncpg://ponto_owner:ponto_owner_ci@localhost:5432/ponto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check app tests alembic
      - run: pytest
