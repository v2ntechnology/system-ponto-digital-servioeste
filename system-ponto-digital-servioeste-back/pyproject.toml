[project]
name = "ponto-api"
version = "0.1.0"
description = "API do Ponto Digital Servioeste (REP-P, Portaria 671/2021)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",          # segundo fator (TOTP, RFC 6238)
    "cryptography>=43",    # cifra o segredo do segundo fator (Fernet); depois, assinatura (feature 009)
    "tzdata",              # fuso de Brasília mesmo em imagens sem a base de fusos
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "openapi-core>=0.19",  # confere as respostas contra contracts/openapi.yaml
    "pyyaml>=6",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert nos testes

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S608"]  # senhas fixas e SQL montado nos testes
"alembic/versions/*" = ["E501"]
